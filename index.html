<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Primeira Venda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="palco">
    <div id="cenario"></div>

    <div id="personagem-esq" class="personagem"></div>
    <div id="personagem-dir" class="personagem"></div>

    <div id="hud-dinheiro">💰 R$ <span id="dinheiro">300</span></div>

    <div id="ps5">
      <div class="ps5-titulo">PS5</div>
      <div class="ps5-trilho"><div id="ps5-preench"></div></div>
      <div id="ps5-pct">0%</div>
    </div>

    <button id="aba-objetivos" type="button">Objetivos</button>
    <div id="painel-objetivos" hidden>Comprar o PS5 – R$ 3.500</div>

    <div id="dialogo">
      <div id="retrato"></div>
      <div id="conteudo">
        <div id="nome"></div>
        <div id="texto"></div>
        <div id="escolhas"></div>
      </div>
    </div>
    <div id="fade"></div>

    <div id="tela-inicial" class="tela">
      <h1>A Primeira Venda</h1>
      <p class="sub">O Eduardo quer um PS5. Ele só tem uma receita de brigadeiro.</p>
      <button id="btn-comecar" class="grande" type="button">Começar</button>
      <p class="dica">Clique, Enter ou espaço para avançar. Nas escolhas, use o mouse ou as teclas A, B e C.</p>
    </div>

    <div id="tela-final" class="tela" hidden>
      <h1 id="final-titulo"></h1>
      <p id="final-sub" class="sub"></p>
      <p id="final-dinheiro" class="dica"></p>
      <h2>O que o Eduardo aprendeu</h2>
      <ul id="final-licoes"></ul>
      <button id="btn-reiniciar" class="grande" type="button">Jogar de novo</button>
    </div>
  </div>

  <script src="js/cenas.js"></script>
  <script src="js/cenas2.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
